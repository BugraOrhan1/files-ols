name: Windows build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch py-ols for the real-sample tests (not bundled)
        shell: pwsh
        run: |
          git clone https://github.com/TheFlashBold/py-ols.git $env:RUNNER_TEMP\py-ols
          git -C $env:RUNNER_TEMP\py-ols checkout 4c283a80161e130b03eb8743c752a689ecda6b78
          "PY_OLS_PATH=$env:RUNNER_TEMP\py-ols" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Use a long-form temp directory
        # The runner's default TEMP is an 8.3 short path (C:\Users\RUNNER~1\...).
        # Existing index code compares resolved and unresolved paths, which
        # differ for 8.3 aliases; see TUNING_STATUS.md (known Windows issue).
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP "tests"
          New-Item -ItemType Directory -Force $t | Out-Null
          "TEMP=$t" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMP=$t" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run full test suite on Windows
        run: python -m unittest discover -s tests -v

      - name: Build EXE
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.11.1
          python -m PyInstaller packaging/OLSTuner.spec --noconfirm --clean
          Copy-Item packaging/LEESMIJ.txt dist/OLSTuner/LEESMIJ.txt
          $zip = "OLSTuner-win64-$($env:GITHUB_SHA.Substring(0,7)).zip"
          Compress-Archive -Path dist/OLSTuner -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Built $zip sha256=$hash"

      - name: Test the distributed archive without Python on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "schone test ü"
          New-Item -ItemType Directory $root | Out-Null
          Expand-Archive $env:ZIP -DestinationPath $root
          $exe = Join-Path $root "OLSTuner\OLSTuner.exe"
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Python|hostedtoolcache' }) -join ';'
          Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $env:OLS_TUNER_HOME = Join-Path $root "lege installatie"
          $env:OLS_TUNER_LOG = Join-Path $root "exe.log"
          function Run($argsList) {
            $p = Start-Process -FilePath $exe -ArgumentList $argsList -Wait -PassThru -NoNewWindow
            return $p.ExitCode
          }
          if ((Run @("--selftest")) -ne 0) { if (Test-Path $env:OLS_TUNER_LOG) { Get-Content $env:OLS_TUNER_LOG }; throw "selftest failed" }
          if ((Run @("--gui-smoke")) -ne 0) { throw "GUI smoke failed" }
          if ((Run @("packages")) -ne 0) { throw "packages on empty install failed" }
          if (Test-Path $env:OLS_TUNER_LOG) { Get-Content $env:OLS_TUNER_LOG }

      - name: Real-sample reproduction through the EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "schone test ü"
          $exe = Join-Path $root "OLSTuner\OLSTuner.exe"
          $store = Join-Path $env:RUNNER_TEMP "pakket bouw"
          # Package is trained with Python + py-ols (library update path), then frozen.
          python -m ols_platform.tuning --store $store train --py-ols $env:PY_OLS_PATH --source "repo=ols files als ols" --exports "ols files geextracteert" --report "$env:RUNNER_TEMP\train.json"
          python -m ols_platform.tuning --store $store export-package "$env:RUNNER_TEMP\frozen.olstune"
          $env:OLS_TUNER_HOME = Join-Path $root "lege installatie"
          $env:OLS_TUNER_LOG = Join-Path $root "exe-real.log"
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Python|hostedtoolcache' }) -join ';'
          function Run($argsList) {
            $p = Start-Process -FilePath $exe -ArgumentList $argsList -Wait -PassThru -NoNewWindow
            return $p.ExitCode
          }
          $orig = Join-Path $root "BMW origineel ü.bin"
          Copy-Item "ols files geextracteert\WinOLS (BMW 7er (Original) - B57D30S0-G1).bin" $orig
          $out = Join-Path $root "uitvoer map ü"
          if ((Run @("install-package", "`"$env:RUNNER_TEMP\frozen.olstune`"")) -ne 0) { throw "install failed" }
          $code = Run @("generate", "`"$orig`"", "--output-dir", "`"$out`"", "--name", "blocked.bin")
          if ($code -ne 4) { if (Test-Path $env:OLS_TUNER_LOG) { Get-Content $env:OLS_TUNER_LOG }; throw "expected export block without integrity contract, got $code" }
          if (Test-Path (Join-Path $out "blocked.bin")) { throw "blocked export left a file" }
          if ((Run @("contract", "MDG1_MD1CP002|2621440", "--flash-tool-corrects", "--evidence", "`"CI-test, geen voertuigvalidatie`"")) -ne 0) { throw "contract failed" }
          if ((Run @("generate", "`"$orig`"", "--output-dir", "`"$out`"", "--name", "stage1.bin")) -ne 0) { if (Test-Path $env:OLS_TUNER_LOG) { Get-Content $env:OLS_TUNER_LOG }; throw "generate failed" }
          $got = (Get-FileHash (Join-Path $out "stage1.bin") -Algorithm SHA256).Hash
          $ref = (Get-FileHash "ols files geextracteert\WinOLS (BMW 7er (Stage 1) - B57D30S0-G1).bin" -Algorithm SHA256).Hash
          if ($got -ne $ref) { throw "EXE output differs from WinOLS Stage 1 export" }
          $code = Run @("generate", "`"ols files geextracteert\WinOLS (Audi A8 (Original) - 522813).DTF`"", "--output-dir", "`"$out`"")
          if ($code -ne 3) { throw "unsuitable original was not rejected ($code)" }
          if (Test-Path $env:OLS_TUNER_LOG) { Get-Content $env:OLS_TUNER_LOG }
          Write-Host "EXE reproduction OK: $got"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: OLSTuner-win64
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
          if-no-files-found: error
