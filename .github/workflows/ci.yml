name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Python test suite
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q ols_platform tests deployment

      - name: Check dashboard JavaScript syntax
        run: node --check ols_platform/dashboard.js

      - name: Check diagnostics JavaScript syntax
        run: node --check ols_platform/diagnostics.js
